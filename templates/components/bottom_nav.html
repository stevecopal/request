{% load i18n %}
{# Bottom navigation mobile-native — visible < lg uniquement (cf. .bottom-nav). #}
{# Les items proviennent de accounts.utils.nav_items(role) : source unique.     #}
<nav class="bottom-nav" aria-label="{% trans 'Navigation principale' %}">
    <div class="max-w-md mx-auto flex h-16">
        {% for item in nav_items %}
            <button type="button"
                    class="bottom-nav__item"
                    {% if item.aria_current %}aria-current="page"{% endif %}
                    {% if item.is_modal %}
                        data-modal-src="{{ item.url }}"
                        data-modal-title="{{ item.modal_title }}"
                    {% else %}
                        data-fragment-src="{{ item.url }}"
                    {% endif %}>
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">{{ item.icon|safe }}</svg>
                <span>{{ item.label }}</span>
            </button>
        {% endfor %}
    </div>
</nav>
