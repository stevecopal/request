{% load i18n %}
{# Corps de la modale de connexion — wiring AJAX assuré par auth_handler.js (P4) #}
{# method="post" + action obligatoires : sans JS, aucune donnée ne part en query string. #}
<form id="login-form" class="space-y-3 sm:space-y-4" novalidate
      method="post"
      action="{% url 'accounts:login' %}"
      data-login-url="{% url 'accounts:login' %}">
    {% csrf_token %}

    <div>
        <label class="label" for="login-matricule">
            {% trans "Matricule ou e-mail" %} <span class="text-red-600" aria-hidden="true">*</span>
        </label>
        <input class="field"
               id="login-matricule"
               name="matricule"
               type="text"
               inputmode="text"
               autocomplete="username"
               autocapitalize="characters"
               enterkeyhint="next"
               spellcheck="false"
               placeholder="{% trans 'Ex. CM-UDS-25SCI0001' %}"
               required>
       
    </div>

    <div>
        <label class="label" for="login-password">
            {% trans "Mot de passe" %} <span class="text-red-600" aria-hidden="true">*</span>
        </label>
        <input class="field"
               id="login-password"
               name="password"
               type="password"
               autocomplete="current-password"
               enterkeyhint="go"
               placeholder="••••••••"
               required>
       
    </div>

    <p id="login-error"
       class="hidden text-sm font-medium text-red-600"
       role="alert"></p>

    <button type="submit" class="btn btn-primary" id="login-submit">
        {% trans "Se connecter" %}
    </button>

    <div class="flex flex-col gap-1 pt-1 text-center text-sm">
        <a href="{% url 'accounts:activation_request' %}"
           class="min-h-11 py-2 font-semibold text-navy-light hover:underline">
            {% trans "Première connexion ? Activez votre compte" %}
        </a>
        <a href="{% url 'accounts:reset_request' %}"
           class="min-h-11 py-2 font-semibold text-navy-light hover:underline">
            {% trans "Mot de passe oublié" %}
        </a>
    </div>
</form>
