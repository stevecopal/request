{% load i18n %}
{% comment %}
Modale « Changer mon mot de passe » (A6) — soumise en AJAX par auth_handler.js.
{% endcomment %}
<form id="change-password-form" class="space-y-4"
      data-password-url="{% url 'accounts:change_password' %}"
      novalidate>
    {% csrf_token %}

    <div>
        <label class="label" for="current-password">
            {% trans "Mot de passe actuel" %} <span class="text-red-600" aria-hidden="true">*</span>
        </label>
        <input class="field" type="password" id="current-password" name="current_password"
               autocomplete="current-password" required>
    </div>

    <div>
        <label class="label" for="new-password1">
            {% trans "Nouveau mot de passe" %} <span class="text-red-600" aria-hidden="true">*</span>
        </label>
        <input class="field" type="password" id="new-password1" name="new_password1"
               autocomplete="new-password" minlength="8" required>
        <p class="helper">{% trans "8 caractères minimum." %}</p>
    </div>

    <div>
        <label class="label" for="new-password2">
            {% trans "Confirmer le nouveau mot de passe" %} <span class="text-red-600" aria-hidden="true">*</span>
        </label>
        <input class="field" type="password" id="new-password2" name="new_password2"
               autocomplete="new-password" minlength="8" required>
    </div>

    <p id="change-password-error" class="hidden text-sm font-medium text-red-600" role="alert"></p>

    <button type="submit" class="btn btn-primary w-full">
        {% trans "Modifier mon mot de passe" %}
    </button>
</form>
